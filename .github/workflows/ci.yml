name: CI — Lint, Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check app/ tests/
      - name: Type check (mypy)
        run: pip install mypy && mypy app/
      - name: Unit & integration tests
        run: pytest tests/ -v
        env:
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.xkXCYxpMbId78W1OCa1aNXNIAEE-yJeACJE7XUvC12k"

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Unit & accessibility tests
        run: npx vitest run
      - name: Production build
        run: npm run build
